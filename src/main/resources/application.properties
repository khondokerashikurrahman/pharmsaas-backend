spring.application.name=pharmsaas-backend
spring.config.import=optional:file:./application-local.properties

server.port=${PORT:9090}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pharmsaas-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

app.super-admin.email=${APP_SUPER_ADMIN_EMAIL:}
app.super-admin.password=${APP_SUPER_ADMIN_PASSWORD:}
app.super-admin.name=${APP_SUPER_ADMIN_NAME:System Super Admin}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=false

app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:}}

logging.level.org.springframework.security=INFO

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.email.brevo.enabled=${BREVO_ENABLED:false}
app.email.brevo.api-key=${BREVO_API_KEY:}
app.email.brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.email.brevo.sender-name=${BREVO_SENDER_NAME:PharmSaaS}

app.payment.sslcommerz.enabled=${SSLCOMMERZ_ENABLED:false}
app.payment.sslcommerz.sandbox=${SSLCOMMERZ_SANDBOX:true}
app.payment.sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:}
app.payment.sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:}
app.payment.sslcommerz.backend-url=${APP_BACKEND_PUBLIC_URL:http://localhost:9090}
app.payment.sslcommerz.frontend-url=${APP_FRONTEND_PUBLIC_URL:http://localhost:4200}
